<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Readex+Pro:wght@200;300;400;500&family=El+Messiri:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/rtl.css" />
  <title>تواصل معنا – نجمة العربية للسياحة والسفر</title>
  <meta name="description" content="تواصل مع نجمة العربية للسياحة والسفر: 0955955927 – 0988477204 – 0932968597. حماة – حي التتان – مقابل جامع التتان." />
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-hero" data-bg="sky">
    <div class="container">
      <p class="crumbs"><a href="index.html">الرئيسية</a> / تواصل معنا</p>
      <h1 class="h-xl">تواصل معنا</h1>
      <p>إنت اختار الطريق، والباقي علينا.</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="contact-cards" id="contactCards"></div>

      <div class="contact-layout">
        <div class="reveal">
          <span class="eyebrow">راسلنا</span>
          <h2 class="h-lg" style="margin-bottom:24px">زورنا أو اتصل فينا</h2>
          <p>مكتبنا: سوريا – حماة – حي التتان – مقابل جامع التتان. للحجز والاستفسار اتصل على أرقامنا أو ابعتلنا رسالة من هون.</p>
          <div class="contact-social" id="contactSocial"></div>
        </div>

        <form class="form form--2 reveal" data-mail="استفسار من الموقع">
          <div class="field"><label for="cName">الاسم الكامل</label><input id="cName" name="الاسم" required /></div>
          <div class="field"><label for="cPhone">رقم الهاتف / واتساب</label><input id="cPhone" name="الهاتف" type="tel" dir="ltr" required /></div>
          <div class="field"><label for="cDest">الوجهة</label><input id="cDest" name="الوجهة" placeholder="مثال: مكة المكرمة" /></div>
          <div class="field"><label for="cSubject">نوع الطلب</label>
            <select id="cSubject" name="نوع الطلب">
              <option>حملة عمرة</option><option>عمرة الطيران</option><option>عمرة استضافة</option><option>تأشيرة السعودية</option>
              <option>موافقة لبنان / ليبيا</option><option>تأشيرة الإمارات</option><option>فيزا تركيا العلاجية</option><option>رحلة إلى بيروت</option><option>حجز طيران / فندق</option><option>إصدار جواز</option><option>شحن دولي</option><option>أخرى</option>
            </select></div>
          <div class="field full"><label for="cMessage">رسالتك</label><textarea id="cMessage" name="الرسالة" required></textarea></div>
          <div class="full">
            <button class="btn btn--solid">إرسال الرسالة
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></button>
            <p class="form__msg" style="margin-top:12px"></p>
          </div>
        </form>
      </div>

      <div class="map reveal">
        <iframe title="موقع المؤسسة" loading="lazy" src="https://www.google.com/maps?q=%D8%AC%D8%A7%D9%85%D8%B9+%D8%A7%D9%84%D8%AA%D8%AA%D8%A7%D9%86+%D8%AD%D9%85%D8%A7%D8%A9&z=16&output=embed"></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
